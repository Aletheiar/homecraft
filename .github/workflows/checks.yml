name: Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: python3 tools/serve.py 8765 > "$RUNNER_TEMP/homecraft-preview.log" 2>&1 &
      - run: npm run check:all -- http://127.0.0.1:8765/
      - run: bash tools/build.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checks-${{ github.run_id }}
          path: tools/.check/
          include-hidden-files: true
          retention-days: 7
